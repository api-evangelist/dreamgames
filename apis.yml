aid: dreamgames
name: dreamgames
description: >-
  Dream Games is a mobile gaming developer with offices in Istanbul and London that builds
  high-quality, long-lifecycle casual puzzle games, best known for Royal Match and Royal Kingdom.
  The company combines technology and creativity to produce polished match-3 titles played by tens
  of millions of players worldwide, and it was surfaced as a portfolio company of balderton-capital.
  Dream Games operates as a consumer game publisher rather than an API provider: it publishes no
  public developer portal, OpenAPI, SDKs, or programmatic API surface. This profile therefore
  captures the company's real public web, legal, and security surface (website, terms, privacy,
  careers, help center, and a published security.txt) rather than developer artifacts.
